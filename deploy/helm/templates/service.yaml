apiVersion: v1
kind: Service
metadata:
  name: {{ include "telegram-mcp.fullname" . }}
  labels:
    {{- include "telegram-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.config.mgmt.enabled }}
    - port: {{ .Values.service.mgmtPort }}
      targetPort: mgmt
      protocol: TCP
      name: mgmt
    {{- end }}
  selector:
    {{- include "telegram-mcp.selectorLabels" . | nindent 4 }}
